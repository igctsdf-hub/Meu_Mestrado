                to:
                  auto: 1
                  value: null
              provider_name: gmail-mcp
              provider_show_name: Gmail MPC Server
              settings: {}
              tool_description: "\n    Sends an email using the Gmail API.\n\n   \
                \ Args:\n        to: The email address of the recipient.\n       \
                \ subject: The subject of the email.\n        body: The body content\
