        - id: d00da352-6e42-4ad5-a78b-b68008c66db3
          role: system
          text: 'FORMATO DA RESPOSTA:

            Você deve obrigatoriamente dividir sua resposta em duas partes claras,
            separadas por uma linha pontilhada:


            PARTE 1: MINUTA SUGERIDA (DFD FINAL) Apresente o rascunho completo do
            DFD, seção por seção, conforme o template oficial (todas as 13 seções)
            .


            PARTE 2: LOG DE ALTERAÇÕES E JUSTIFICATIVAS Apresente uma lista comparativa
            destacando o que foi melhorado em relação ao texto original do servidor.
            Utilize o seguinte padrão: * Seção [Número]: O que foi alterado e qual
            a fundamentação técnica (ex: Manual do STM ou Lei 14.133/21).


            Melhoria Identificada: Explique brevemente por que a nova redação é superior
            (ex: maior clareza, mitigação de risco ou conformidade legal).

            Toda a análise deve conter no máximo 3000 tokens.'
        - id: a3348fc9-92d3-406b-a69c-dec6ab21fd6c
          role: user
          text: 'DADOS PARA TRABALHO:


            Com base na análise de conformidade abaixo, reescreva o DFD corrigido.


            DFD ORIGINAL:

            {{#1775669171838.text#}}


            ANÁLISE DO AUDITOR:

            {{#1775670102009.text#}}


            --------------------------

            COMANDO:

            Com base na análise técnica acima, reescreva o DFD do servidor seguindo
            rigorosamente as 13 seções do template oficial do STM. Garanta que as
            falhas apontadas sejam corrigidas na nova redação.

            Com base na análise técnica acima, reescreva o DFD do servidor seguindo
            rigorosamente as 13 seções do template oficial do STM . Após a redação,
            elabore o Relatório de Alterações comparando o seu texto com o original
            para que o destinatário entenda as melhorias realizadas.'
        selected: false
